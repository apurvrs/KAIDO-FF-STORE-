<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAIDO FF STORE | Admin Panel</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/admin.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body>


<div class="aurora">

<span></span>
<span></span>
<span></span>

</div>



<header class="navbar">


<div class="logo">

<i class="fa-solid fa-fire"></i>

KAIDO FF STORE ADMIN

</div>


</header>





<section class="admin-section">



<div class="admin-box">


<h1>

Add New Free Fire ID

</h1>



<form id="productForm">


<input 
type="text"
id="name"
placeholder="Account Name"
required>



<input 
type="number"
id="price"
placeholder="Price"
required>



<input 
type="text"
id="image"
placeholder="Image URL"
required>



<input 
type="number"
id="level"
placeholder="Account Level"
required>



<select id="category">


<option value="legendary">
Legendary
</option>


<option value="premium">
Premium
</option>


<option value="rare">
Rare
</option>


<option value="budget">
Budget
</option>


</select>



<button class="primary-btn">

Add Product

</button>


</form>



</div>



</section>





<script src="js/admin.js"></script>


</body>

</html>
